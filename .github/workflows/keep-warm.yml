name: Keep Warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          BACKEND_URL="${{ vars.BACKEND_API_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_API_URL repository variable not set, skipping keep-warm ping."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/health")
          echo "Health check status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed with HTTP $STATUS"
            exit 1
          fi
